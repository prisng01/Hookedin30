<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iOS Compatible Audio Game</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 2rem;
      background: #111;
      color: #fff;
    }
    .btn {
      padding: 15px 30px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      background: #ff4081;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 64, 129, 0.4);
    }
    .note {
      margin-top: 15px;
      font-size: 0.85rem;
      color: #aaa;
    }
  </style>
</head>
<body>

  <h1>Birthday Game</h1>
  <button id="startBtn" class="btn">🔊 Tap to Start Game & Music</button>
  <p class="note">⚠️ iPhone Users: Ensure your phone is NOT on Silent Mode.</p>

  <!-- Use a direct MP3/AAC audio link instead of YouTube for iOS Safari -->
  <audio id="bgMusic" loop preload="auto">
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <script>
    const startBtn = document.getElementById('startBtn');
    const audio = document.getElementById('bgMusic');

    startBtn.addEventListener('click', function() {
      // Unlocks and plays audio synchronously inside the tap event (Required by iOS Safari)
      audio.play().then(() => {
        startBtn.innerText = "🎮 Game Started! (Music Playing)";
        startBtn.style.background = "#4CAF50";
      }).catch(err => {
        alert("Playback blocked. Please ensure Silent Mode is off and try again.");
        console.error(err);
      });
    });
  </script>
</body>
</html>
