<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hooked In 30</title>

    <link rel="stylesheet" href="style.css">
</head>

         MAIN GAME CONTAINER
    ========================================== -->

        ========================================== -->
        <section id="game1" class="game-screen">

            <img
                src="assets/game-01/01_intro_screen.png"

        <!-- =========================================
             GAME 2
        ========================================== -->

            >

        </section>


        <!-- =========================================
             GAME 3
        ========================================== -->
        <section id="game3" class="game-screen hidden">

            <img
                src="assets/game-03/game3_intro_page.png"

                class="game-image"
            >

        </section>

    </main>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->
    <script src="game.js"></script>

</html>
