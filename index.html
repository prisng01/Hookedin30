<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hooked In 30</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================
         MAIN GAME CONTAINER
    ========================================== -->
    <main id="game-container">

        <!-- =========================================
             MISSION 3 FRONT PAGE
             Actual filename:
             Mission3frontpage.png
        ========================================== -->
        <section id="mission3-intro" class="game-screen">

            <div class="mission3-frontpage">

                <img
                    src="assets/Mission3frontpage.png"
                    alt="Welcome to Mission 3 - The Final Mission"
                    class="mission3-image"
                >

                <button
                    id="beginMission3"
                    class="mission3-start-button"
                    type="button"
                >
                    BEGIN MISSION 3 →
                </button>

            </div>

        </section>


        <!-- =========================================
             GAME 1
             Assets are inside assets/game-01/
        ========================================== -->
        <section id="game1" class="game-screen hidden">

            <img
                src="assets/game-01/01_intro_screen.png"
                alt="Hooked In 30 - Game 1"
                class="game-image"
            >

        </section>


        <!-- =========================================
             GAME 2
             Assets are inside assets/game-02/
        ========================================== -->
        <section id="game2" class="game-screen hidden">

            <img
                src="assets/game-02/g2_title.png"
                alt="Hooked In 30 - Game 2"
                class="game-image"
            >

        </section>


        <!-- =========================================
             GAME 3
             Assets are inside assets/game-03/
        ========================================== -->
        <section id="game3" class="game-screen hidden">

            <img
                src="assets/game-03/game3_intro_page.png"
                alt="Hooked In 30 - Game 3"
                class="game-image"
            >

        </section>

    </main>


    <!-- =========================================
         GAME JAVASCRIPT
    ========================================== -->
    <script src="game.js"></script>

</body>
</html>
