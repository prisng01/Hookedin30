<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operation Birthday 30: Mission 02</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Game HUD -->
    <header id="gameHUD">
        <div class="hudLeft">
            <div id="timerDisplay">10:00</div>
        </div>

        <div class="hudCenter">
            <div class="bearContainer">
                <span class="bearIcon">🐻</span>
                <div class="bearTrack">
                    <div id="bearProgress"></div>
                </div>
                <span class="campIcon">⛺</span>
            </div>
            <!-- Added Bear Distance Tracker -->
            <p id="bearProximityText">95m</p>
        </div>

        <div class="hudRight">
            <!-- Added Hint Button with pointer-events enabled via style/class -->
            <button id="hintButton" class="btn">? HINT 3</button>
        </div>
    </header>

    <!-- Main Game Viewport / Canvas Area -->
    <main id="gameContainer">
        <!-- Canvas or game elements go here -->
    </main>

    <!-- Inventory Section -->
    <section id="inventoryBar">
        <div class="inventorySlot" style="opacity: 0.45;">
            <p>Compass</p>
        </div>
        <div class="inventorySlot" style="opacity: 0.45;">
            <p>Map</p>
        </div>
        <div class="inventorySlot" style="opacity: 0.45;">
            <p>Flashlight</p>
        </div>
    </section>

    <script src="game.js"></script>
</body>
</html>
